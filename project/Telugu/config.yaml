dataset: "IndicTTS_Telugu"

path:
  preprocessed_path: "preprocessed_data/IndicTTS_Telugu"
  checkpoint_path: "checkpoints"
  result_path: "../Results/Telugu"

preprocessing:
  val_size: 512
  train_hours: 5.0
  val_hours: 1.0
  text:
    text_cleaners: ["telugu_cleaners"]
    language: "te"
  audio:
    sampling_rate: 22050
    max_wav_value: 32768.0
  stft:
    filter_length: 1024
    hop_length: 256
    win_length: 1024
  mel:
    n_mel_channels: 80
    mel_fmin: 0
    mel_fmax: 8000
  pitch:
    feature: "phoneme_level"
    normalization: True
  energy:
    feature: "phoneme_level"
    normalization: True

transformer:
  encoder_layer: 4
  encoder_head: 2
  encoder_hidden: 256
  decoder_layer: 4
  decoder_head: 2
  decoder_hidden: 256
  conv_filter_size: 1024
  conv_kernel_size: [9, 1]
  encoder_dropout: 0.2
  decoder_dropout: 0.2

variance_predictor:
  filter_size: 256
  kernel_size: 3
  dropout: 0.5

variance_embedding:
  pitch_quantization: "log"
  energy_quantization: "log"
  n_bins: 256

multi_speaker: False
max_seq_len: 1000

vocoder:
  model: "HiFi-GAN"
  speaker: "universal"
  config_path: "hifigan/config.json"
  model_path: "hifigan/generator_universal.pth.tar"

train:
  batch_size: 16
  epochs: 100
  learning_rate: 0.001
  betas: [0.9, 0.98]
  eps: 0.000000001
  weight_decay: 0.000001
  grad_clip_thresh: 1.0
  grad_acc_step: 1
  warmup_step: 4000
  anneal_steps: [300000, 400000, 500000]
  anneal_rate: 0.3
  log_step: 100
  val_step: 500
  save_step: 2000
